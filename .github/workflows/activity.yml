name: Refresh activity

on:
  schedule:
    - cron: "17 3 * * *"   # chaque jour à 03h17 UTC
  workflow_dispatch:        # bouton « Run workflow » dans l'onglet Actions
  push:
    branches: [main]
    paths: ["scripts/activity.py", "scripts/build.py", "scripts/content.py"]

permissions:
  contents: write

jobs:
  activity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements-ci.txt
      - name: Generate activity visuals
        env:
          # PROFILE_TOKEN (optionnel, scope read:user) ajoute les contributions privées
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/activity.py --user "${{ github.repository_owner }}"
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || (git commit -m "chore: refresh activity" && git push)
